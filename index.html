<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Ocean 3D Simulation</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #cfd8df; }
        canvas { display: block; }
        #fps { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.55); color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 12px; letter-spacing: 0.8px; z-index: 100; backdrop-filter: blur(12px); }
        .value { color: #60a5fa; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; }
        #info { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 12px 16px; border-radius: 12px; font-size: 11px; line-height: 1.6; backdrop-filter: blur(20px); opacity: 0.9; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.85); box-shadow: 0 0 0 1px rgba(0,0,0,0.5); pointer-events: none; z-index: 50; }
        #startPrompt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, 40px); background: rgba(0,0,0,0.6); color: white; padding: 12px 22px; border-radius: 12px; font-size: 15px; letter-spacing: 0.5px; pointer-events: none; z-index: 60; backdrop-filter: blur(12px); }
    </style>
</head>
<body>
    <div id="fps">FPS <span class="value" id="fpsInControls">60</span></div>
    <div id="crosshair"></div>
    <div id="startPrompt">Click to play</div>

    <div id="info">
        <div><strong>Controls</strong></div>
        <div>Click: capture mouse (Esc to release)</div>
        <div>WASD / Arrows: Move</div>
        <div>Mouse: Look around</div>
        <div>Space: Up &nbsp;|&nbsp; C: Down</div>
        <div>Shift: Sprint</div>
    </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { Water } from 'three/addons/objects/Water.js';
        import { Sky } from 'three/addons/objects/Sky.js';
        import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

        // Performance monitoring
        let frameCount = 0;
        let lastTime = performance.now();
        let fpsHistory = [];

        // Keyboard movement state
        const keys = { forward: false, backward: false, left: false, right: false, up: false, down: false, sprint: false };

        // Movement settings
        const moveSpeed = 50;
        const lookSpeed = 0.002;

        // Water interaction settings
        let previousPosition = new THREE.Vector3();
        let velocity = new THREE.Vector3();
        let ripples = [];
        const maxRipples = 10;
        const waterLevel = 0;

        // ## SCENE SETUP ##
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);

        const renderer = new THREE.WebGLRenderer({
            antialias: true, powerPreference: "high-performance", stencil: false,
            depth: true, alpha: false, premultipliedAlpha: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.setClearColor(0x000000, 0);
        renderer.setClearAlpha(0);
        document.body.appendChild(renderer.domElement);


        camera.position.set(12, 6, 18);
        previousPosition.copy(camera.position);

        let pitch = 0;
        let yaw = 0;
        const isFirstPerson = true;

        // Lighting
        const sunLight = new THREE.DirectionalLight(0xffc4ac, 1.2);
        sunLight.position.set(-40, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.1;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x6a4a52, 0.3);
        scene.add(ambientLight);

        const fillLight = new THREE.DirectionalLight(0x87ceeb, 0.2);
        fillLight.position.set(40, 30, -30);
        scene.add(fillLight);

        function updateLighting() {
            const fillLightOffset = new THREE.Vector3(40, 30, -30);
            fillLight.position.copy(camera.position.clone().add(fillLightOffset));
        }

        // ## THREE.JS WATER ##
        const waterGeometry = new THREE.PlaneGeometry(10000, 10000);

        const water = new Water(waterGeometry, {
            textureWidth: 512,
            textureHeight: 512,
            waterNormals: new THREE.TextureLoader().load('https://threejs.org/examples/textures/waternormals.jpg', function (texture) {
                texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            }),
            sunDirection: new THREE.Vector3(),
            sunColor: 0xffbfa6,
            waterColor: 0x001e0f,
            distortionScale: 3.7,
            fog: scene.fog !== undefined
        });

        // Custom uniforms for interaction
        water.material.uniforms.userPosition = { value: new THREE.Vector3() };
        water.material.uniforms.userVelocity = { value: 0.0 };
        water.material.uniforms.ripplePositions = { value: [] };
        water.material.uniforms.rippleTimes = { value: [] };
        water.material.uniforms.rippleCount = { value: 0 };

        water.material.vertexShader = water.material.vertexShader.replace(
            'void main() {',
            `
            uniform vec3 userPosition;
            uniform float userVelocity;
            uniform vec3 ripplePositions[10];
            uniform float rippleTimes[10];
            uniform int rippleCount;

            float calculateUserWave(vec3 worldPos) {
                float wave = 0.0;
                float dist = distance(worldPos.xz, userPosition.xz);
                float userWave = 0.0;
                if (dist < 50.0) {
                    float falloff = 1.0 - (dist / 50.0);
                    userWave = sin(dist * 0.5 - time * 4.0) * userVelocity * 0.5 * falloff;
                }
                for (int i = 0; i < 10; i++) {
                    if (i >= rippleCount) break;
                    float rippleDist = distance(worldPos.xz, ripplePositions[i].xz);
                    float rippleAge = time - rippleTimes[i];
                    if (rippleAge > 0.0 && rippleAge < 3.0 && rippleDist < 30.0) {
                        float rippleSpeed = 15.0;
                        float expectedPos = rippleAge * rippleSpeed;
                        float wavefront = abs(rippleDist - expectedPos);
                        if (wavefront < 2.0) {
                            float intensity = (1.0 - rippleAge / 3.0) * (1.0 - wavefront / 2.0);
                            wave += sin(rippleDist * 0.8 - time * 3.0) * intensity * 0.8;
                        }
                    }
                }
                return wave;
            }

            void main() {`
        );

        water.material.vertexShader = water.material.vertexShader.replace(
            'vec4 worldPosition = modelMatrix * vec4( transformed, 1.0 );',
            `
            vec4 worldPosition = modelMatrix * vec4( transformed, 1.0 );
            float userWave = calculateUserWave(worldPosition.xyz);
            worldPosition.y += userWave;
            `
        );

        water.rotation.x = -Math.PI / 2;
        scene.add(water);

        // Sky
        const sky = new Sky();
        sky.scale.setScalar(10000);
        scene.add(sky);

        const skyUniforms = sky.material.uniforms;
        skyUniforms['turbidity'].value = 11;
        skyUniforms['rayleigh'].value = 1.0;
        skyUniforms['mieCoefficient'].value = 0.011;
        skyUniforms['mieDirectionalG'].value = 0.8;

        // Sun setup
        const sun = new THREE.Vector3();
        const pmremGenerator = new THREE.PMREMGenerator(renderer);

        const parameters = { elevation: 2, azimuth: 0 };

        function updateSun() {
            const phi = THREE.MathUtils.degToRad(90 - parameters.elevation);
            const theta = THREE.MathUtils.degToRad(parameters.azimuth);
            sun.setFromSphericalCoords(1, phi, theta);
            const sunWorldPosition = camera.position.clone().add(sun.clone().multiplyScalar(1000));
            sunLight.position.copy(sunWorldPosition);
            sky.material.uniforms['sunPosition'].value.copy(sun);
            water.material.uniforms['sunDirection'].value.copy(sun).normalize();
        }
        updateSun();

        // ## OVERCAST CLOUD LAYER (set CLOUDS = true to bring it back) ##
const CLOUDS = false;
const cloudMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    side: THREE.BackSide, transparent: true, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
        varying vec3 vDir; uniform float time;
        float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
            return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
        float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * n(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }
        void main(){
            vec3 d = normalize(vDir);
            if (d.y < -0.02) discard;
            float up = max(d.y, 0.0);
            vec2 uv = d.xz / (up + 0.22) * 1.6 + vec2(time * 0.012, time * 0.006);
            float cover = smoothstep(0.28, 0.62, fbm(uv));
            float shade = fbm(uv * 2.0 + 5.0);
            vec3 col = mix(vec3(0.95, 0.96, 0.98), vec3(0.66, 0.70, 0.76), shade * cover * 0.85);   // bright tops, soft grey undersides
            float horizon = smoothstep(0.0, 0.25, up);
            col = mix(vec3(0.82, 0.86, 0.90), col, horizon);                                         // hazy horizon
            gl_FragColor = vec4(col, mix(0.9, cover * 0.97, horizon));
        }`
});
const cloudDome = new THREE.Mesh(new THREE.SphereGeometry(1200, 32, 16), cloudMat);
cloudDome.renderOrder = -1;
cloudDome.frustumCulled = false;
scene.add(cloudDome);

// ## KOREAN-COAST ISLAND ##
// Paste this right AFTER the line `updateSun();` (just before "## PERFORMANCE OPTIMIZATION ##").
// Rugged granite ridges, pine forest, rocky headlands, sea stacks, a lighthouse and a small fishing village.

const island = new THREE.Group();
island.position.set(0, 0, -365);   // move this to put the island elsewhere
scene.add(island);

// ---------- noise helpers ----------
const hash = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4) {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; }
    return s;
}

// ---------- coastline + river layout ----------
const ISLAND_SIZE = 700;
function coastD(x, z) {                                           // >0 = land, <0 = sea
    const ang = Math.atan2(z, x);
    const r = Math.hypot(x * 0.8, z) / 262;                       // slightly elongated island
    const coast = 0.6
        + 0.55 * (fbm(Math.cos(ang) * 1.6 + 7, Math.sin(ang) * 1.6 + 7, 4) - 0.45)  // big bays & headlands
        + 0.05 * (vnoise(ang * 14, 3) - 0.5);                                         // jagged shoreline
    return coast - r;
}
// River flows from the mountains toward +z (toward your start position) and empties into the sea
const riverX = z => 14 * Math.sin(z * 0.028 + 1) + 7 * Math.sin(z * 0.075 + 2) - 10;
const riverDist = (x, z) => Math.abs(x - riverX(z));
let zMouth = 150;
for (let z = 380; z > -380; z -= 2) { if (coastD(riverX(z), z) > 0.03) { zMouth = z; break; } }
let zSrc = zMouth;
for (let z = zMouth; z > zMouth - 230; z -= 2) { if (coastD(riverX(z), z) <= 0.03) break; zSrc = z; }
const riverSurfaceY = z => 0.1 + Math.max(0, zMouth - z) * 0.1;  // gentle downhill slope to the sea

// ---------- height function ----------
function heightAt(x, z) {
    const d = coastD(x, z);
    if (d <= 0) return Math.max(d * 130, -40);                     // drops quickly into deep water
    const inland = Math.min(d / 0.45, 1);
    const ridge = Math.pow(1 - Math.abs(2 * fbm(x * 0.008 + 20, z * 0.008 + 20, 4) - 1), 2.2); // jagged granite peaks
    const rock = vnoise(x * 0.09, z * 0.09) * 5;
    const m = sstep(0.18, 0.5, d);                                // mountains only inland; a flat coastal plain for towns
    let h = sstep(0, 0.05, d) * (2.5 + vnoise(x * 0.02, z * 0.02) * 1.8 + m * (inland * 24 + ridge * inland * 62 + rock * inland));
    if (z > zSrc - 20 && z < zMouth + 30) {                       // carve the river valley
        const rd = Math.abs(x - riverX(z));
        const w = (1 - sstep(10, 26, rd)) * sstep(zSrc - 6, zSrc + 16, z);
        if (w > 0) {
            const bed = riverSurfaceY(z) - 1.3 + sstep(3.6, 9.5, rd) * 3.2;   // channel + banks
            h = h * (1 - w) + bed * w;
        }
    }
    return h;
}
function slopeAt(x, z) {
    const e = 1.5;
    const dx = heightAt(x + e, z) - heightAt(x - e, z);
    const dz = heightAt(x, z + e) - heightAt(x, z - e);
    return Math.hypot(dx, dz) / (2 * e);
}

// ---------- terrain mesh ----------
const SEGS = 370;
const terrainGeo = new THREE.PlaneGeometry(ISLAND_SIZE, ISLAND_SIZE, SEGS, SEGS);
terrainGeo.rotateX(-Math.PI / 2);
const tp = terrainGeo.attributes.position;
for (let i = 0; i < tp.count; i++) tp.setY(i, heightAt(tp.getX(i), tp.getZ(i)));
terrainGeo.computeVertexNormals();

const sand = new THREE.Color(0xd8c79a), cliff = new THREE.Color(0x77736b), highRock = new THREE.Color(0xa49f94);
const pine = new THREE.Color(0x2c5532), pineDark = new THREE.Color(0x1f4228), scrub = new THREE.Color(0x5f7a3a);
const seabedCol = new THREE.Color(0x4a5a58);
const col = new THREE.Color();
const colors = new Float32Array(tp.count * 3);
const tn = terrainGeo.attributes.normal;
for (let i = 0; i < tp.count; i++) {
    const h = tp.getY(i), x = tp.getX(i), z = tp.getZ(i);
    const slope = 1 - tn.getY(i);
    const n = vnoise(x * 0.15, z * 0.15);
    if (h < 0) col.copy(seabedCol);
    else if (h < 2.2 && slope < 0.2) col.copy(sand);
    else if (slope > 0.32) col.copy(cliff).lerp(highRock, n * 0.5);
    else if (h > 50) col.copy(highRock).lerp(cliff, n);
    else {
        col.copy(pine).lerp(pineDark, n);
        col.lerp(scrub, sstep(30, 48, h) * 0.7);                   // sparse scrub near ridgelines
        col.lerp(cliff, sstep(0.18, 0.32, slope));
    }
    if (z > zSrc - 8 && z < zMouth + 4 && riverDist(x, z) < 5.5 && h > -3) col.set(0x857d6a).lerp(sand, 0.3);   // pebbly river bed
    colors.set([col.r, col.g, col.b], i * 3);
}
terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 }));
terrain.castShadow = terrain.receiveShadow = true;
island.add(terrain);

// ---------- choose town sites (flat, low ground) ----------
const towns = [];
for (let pass = 0; pass < 2 && towns.length < 6; pass++) {
    for (let tries = 0; tries < 6000 && towns.length < 6; tries++) {
        const x = (Math.random() - 0.5) * ISLAND_SIZE * 0.8, z = (Math.random() - 0.5) * ISLAND_SIZE * 0.8;
        const h = heightAt(x, z);
        if (h < 2 || h > (pass ? 16 : 9) || slopeAt(x, z) > (pass ? 0.16 : 0.09) || riverDist(x, z) < 14) continue;
        if (towns.some(t => Math.hypot(t.x - x, t.z - z) < 75)) continue;
        towns.push({ x, z, rad: 38 + Math.random() * 14, ang: Math.random() * Math.PI });
    }
}
// mountain districts: terraced towers climbing the interior slopes
const hills = [];
for (let tries = 0; tries < 10000 && hills.length < 14; tries++) {
    const x = (Math.random() - 0.5) * ISLAND_SIZE * 0.7, z = (Math.random() - 0.5) * ISLAND_SIZE * 0.7;
    const h = heightAt(x, z);
    if (coastD(x, z) < 0.22 || h < 18 || h > 80 || riverDist(x, z) < 30) continue;
    if (hills.some(t => Math.hypot(t.x - x, t.z - z) < 50)) continue;
    hills.push({ x, z, rad: 44 + Math.random() * 18, ang: Math.random() * Math.PI });
}
const nearTown = (x, z) => towns.some(t => Math.hypot(t.x - x, t.z - z) < t.rad * 1.6)
    || hills.some(t => Math.hypot(t.x - x, t.z - z) < t.rad * 1.2);

// ---------- pine forest (instanced) ----------
const treeGeo = new THREE.ConeGeometry(1.3, 6, 6); treeGeo.translate(0, 3, 0);
const treeMesh = new THREE.InstancedMesh(treeGeo, new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true }), 4500);
const dummy = new THREE.Object3D(); const tc = new THREE.Color();
let placed = 0;
for (let tries = 0; tries < 40000 && placed < 4500; tries++) {
    const x = (Math.random() - 0.5) * ISLAND_SIZE, z = (Math.random() - 0.5) * ISLAND_SIZE;
    const h = heightAt(x, z);
    if (h < 2.5 || h > 42 || slopeAt(x, z) > 0.55) continue;
    if (riverDist(x, z) < 8 || nearTown(x, z)) continue;
    if (fbm(x * 0.03 + 50, z * 0.03 + 50, 3) < 0.35) continue;      // leave clearings
    const s = 0.7 + Math.random() * 1.1;
    dummy.position.set(x, h - 0.3, z);
    dummy.scale.set(s, s * (0.9 + Math.random() * 0.5), s);
    dummy.rotation.y = Math.random() * Math.PI;
    dummy.updateMatrix();
    treeMesh.setMatrixAt(placed, dummy.matrix);
    treeMesh.setColorAt(placed, tc.setHSL(0.35 + Math.random() * 0.04, 0.45, 0.14 + Math.random() * 0.08));
    placed++;
}
treeMesh.count = placed;
treeMesh.castShadow = true;
island.add(treeMesh);

// ---------- offshore sea stacks (like the rocks at Kumgang / Chongseokjong) ----------
const stackMat = new THREE.MeshStandardMaterial({ color: 0x8a867d, roughness: 1, flatShading: true });
let stacks = 0;
for (let tries = 0; tries < 600 && stacks < 12; tries++) {
    const ang = Math.random() * Math.PI * 2, rad = 190 + Math.random() * 140;
    const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
    if (heightAt(x, z) > -3) continue;                              // must be in water, not on land
    const hgt = 45 + Math.random() * 20;
    const g = new THREE.CylinderGeometry(1.5 + Math.random() * 2.5, 5 + Math.random() * 4, hgt, 7, 8);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
        p.setX(i, p.getX(i) + (Math.random() - 0.5) * 1.6);
        p.setZ(i, p.getZ(i) + (Math.random() - 0.5) * 1.6);
        p.setY(i, p.getY(i) + (Math.random() - 0.5) * 1.2);
    }
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, stackMat);
    m.position.set(x, -40 + hgt / 2, z);
    m.castShadow = m.receiveShadow = true;
    island.add(m);
    stacks++;
}

// ---------- find shoreline spots for structures ----------
function findShore(angle) {
    for (let r = 380; r > 0; r -= 1) {
        const x = Math.cos(angle) * r, z = Math.sin(angle) * r;
        if (heightAt(x, z) > 3.5) return { x, z, r };
    }
    return null;
}

// Lighthouse on a headland
const lhSpot = findShore(Math.PI * 0.25);
if (lhSpot) {
    const lh = new THREE.Group();
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.8, 10, 12), new THREE.MeshStandardMaterial({ color: 0xf2f2ee }));
    tower.position.y = 5;
    const stripe = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.5, 2, 12), new THREE.MeshStandardMaterial({ color: 0xb3282d }));
    stripe.position.y = 5;
    const lamp = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 1.4, 12), new THREE.MeshStandardMaterial({ color: 0xffe9a0, emissive: 0xffc94d, emissiveIntensity: 0.6 }));
    lamp.position.y = 10.7;
    const cap = new THREE.Mesh(new THREE.ConeGeometry(1.5, 1.4, 12), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    cap.position.y = 12.1;
    lh.add(tower, stripe, lamp, cap);
    lh.position.set(lhSpot.x, heightAt(lhSpot.x, lhSpot.z), lhSpot.z);
    lh.traverse(o => { if (o.isMesh) o.castShadow = true; });
    island.add(lh);
}

// ---------- TOWNS: Kowloon Walled City-style megablocks ----------
const bDummy = new THREE.Object3D();
const placedB = [];
const pick = a => a[Math.floor(Math.random() * a.length)];

// facade tile: dark windows, AC boxes, rust strips, grime; plus a matching emissive map so some windows glow
const FCOLS = 6, FROWS = 6, FTW = 256, FTH = 256;
const facade = (() => {
    const c = document.createElement('canvas'), e = document.createElement('canvas');
    c.width = e.width = FTW; c.height = e.height = FTH;
    const g = c.getContext('2d'), ge = e.getContext('2d');
    g.fillStyle = '#d4d0c6'; g.fillRect(0, 0, FTW, FTH);
    ge.fillStyle = '#000'; ge.fillRect(0, 0, FTW, FTH);
    const cw = FTW / FCOLS, rh = FTH / FROWS;
    for (let r = 0; r < FROWS; r++) {
        g.fillStyle = 'rgba(60,55,45,0.35)'; g.fillRect(0, r * rh, FTW, 3);                     // floor slab line
        for (let q = 0; q < FCOLS; q++) {
            const x = q * cw + 7, y = r * rh + 9;
            g.fillStyle = '#2b3640'; g.fillRect(x, y, cw - 14, rh - 20);                          // window

function updateFish(t, dt) {
    for (const s of schools) {
        s.center.set(
            s.home.x + Math.sin(t * 0.07 + s.ph) * s.wander,
            s.home.y + Math.sin(t * 0.05 + s.ph * 2) * 5,
            s.home.z + Math.cos(t * 0.06 + s.ph) * s.wander
        );
        for (let i = 0; i < s.fish.length; i++) {
            const f = s.fish[i];
            fTarget.copy(s.center).add(f.off);
            fTarget.x += Math.sin(t * 0.8 + f.ph) * 3;
            fTarget.y += Math.sin(t * 0.6 + f.ph * 1.7) * 1.5;
            fDesired.subVectors(fTarget, f.p);
            const dist = fDesired.length();
            fDesired.normalize().multiplyScalar(s.speed * (0.6 + Math.min(dist / 10, 1) * 0.8));
            f.v.lerp(fDesired, Math.min(1, dt * 1.5));
            f.p.addScaledVector(f.v, dt);

            // stay underwater, above the seabed / island slopes
            let floor = SEABED_Y + 2;

                floor = Math.max(floor, heightAt(f.p.x - island.position.x, f.p.z - island.position.z) + 1.5);
            }
            if (floor > -2) { f.v.x *= -1; f.v.z *= -1; f.p.addScaledVector(f.v, dt * 2); }   // bounce off the island
            f.p.y = Math.min(-1.5, Math.max(floor, f.p.y));

            fishDummy.rotation.set(0, Math.atan2(-f.v.z, f.v.x), Math.asin(THREE.MathUtils.clamp(f.v.y / sp, -1, 1)), 'YZX');
            fishDummy.scale.setScalar(f.s);
            fishDummy.updateMatrix();
            s.mesh.setMatrixAt(i, fishDummy.matrix);

}

    const t = now / 1000;

    const under = camera.position.y < 0;
    uwBlend += ((under ? 1 : 0) - uwBlend) * Math.min(1, dt * 8);
    scene.fog.color.copy(HAZE).lerp(DEEP, uwBlend);
    scene.fog.density = 0.00035 + (0.028 - 0.00035) * uwBlend;
    sky.visible = !under;
    cloudDome.visible = CLOUDS && !under;
    cloudDome.position.copy(camera.position);
    cloudMat.uniforms.time.value = t;
    scene.background = under ? scene.fog.color : null;

    updateFish(t, dt);
    updateRiverFish(t, dt);
}


        // ## PERFORMANCE OPTIMIZATION ##
        const clock = new THREE.Clock();
        let adaptiveQuality = 1.0;

        function updatePerformance() {
            const currentTime = performance.now();
            const deltaTime = currentTime - lastTime;
            const fps = 1000 / deltaTime;

            fpsHistory.push(fps);
            if (fpsHistory.length > 60) fpsHistory.shift();

            const avgFps = fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length;

            if (avgFps < 45 && adaptiveQuality > 0.5) {
                adaptiveQuality = Math.max(0.5, adaptiveQuality - 0.1);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio * adaptiveQuality, 1));
            } else if (avgFps > 55 && adaptiveQuality < 1.0) {
                adaptiveQuality = Math.min(1.0, adaptiveQuality + 0.05);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio * adaptiveQuality, 2));
            }

            lastTime = currentTime;

            if (frameCount % 30 === 0) {
                document.getElementById('fpsInControls').textContent = Math.round(avgFps);
            }
        }

        // Ripple effect
        function createRipple(position) {
            if (ripples.length >= maxRipples) ripples.shift();
            ripples.push({ position: position.clone(), time: water.material.uniforms.time.value });
            water.material.uniforms.ripplePositions.value = ripples.map(r => r.position);
            water.material.uniforms.rippleTimes.value = ripples.map(r => r.time);
            water.material.uniforms.rippleCount.value = ripples.length;
        }

        // Movement with water interaction
        function updateMovement(deltaTime) {
            if (!isFirstPerson) return;

            previousPosition.copy(camera.position);

            const moveVector = new THREE.Vector3();
            const cameraDirection = new THREE.Vector3();

            camera.getWorldDirection(cameraDirection);
            const right = new THREE.Vector3().crossVectors(cameraDirection, camera.up).normalize();
            const forward = cameraDirection.clone();
            forward.normalize();                       // full 3D: look down + W to dive

            if (keys.forward) moveVector.add(forward);
            if (keys.backward) moveVector.sub(forward);
            if (keys.left) moveVector.sub(right);
            if (keys.right) moveVector.add(right);
            if (keys.up) moveVector.add(camera.up);
            if (keys.down) moveVector.sub(camera.up);

            if (moveVector.length() > 0) {
                moveVector.normalize();
                moveVector.multiplyScalar(moveSpeed * (keys.sprint ? 2.5 : 1) * deltaTime);
                camera.position.add(moveVector);
            }

            velocity.subVectors(camera.position, previousPosition).divideScalar(deltaTime);
            const speed = velocity.length();

            water.material.uniforms.userPosition.value.copy(camera.position);
            water.material.uniforms.userVelocity.value = Math.min(speed / 50, 1.0);

            const distanceToWater = Math.abs(camera.position.y - waterLevel);
            if (speed > 20 && distanceToWater < 10) {
                if (Math.random() < 0.1) createRipple(camera.position);
            }

            if ((previousPosition.y > waterLevel && camera.position.y <= waterLevel) ||
                (previousPosition.y < waterLevel && camera.position.y >= waterLevel)) {
                createRipple(new THREE.Vector3(camera.position.x, waterLevel, camera.position.z));
            }
        }

        // ## ANIMATION LOOP ##
        function animate() {
            requestAnimationFrame(animate);
            frameCount++;

            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            const elapsedTime = clock.getElapsedTime();

            water.material.uniforms['time'].value = elapsedTime;

            updateMovement(deltaTime);
            updateSun();
            updateLighting();

            updateOcean();          // underwater fog + fish
            updatePerformance();

            renderer.render(scene, camera);
        }

        // ## KEYBOARD AND MOUSE CONTROLS ##
        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': keys.forward = true; break;
                case 'ArrowDown': case 'KeyS': keys.backward = true; break;
                case 'ArrowLeft': case 'KeyA': keys.left = true; break;
                case 'ArrowRight': case 'KeyD': keys.right = true; break;
                case 'Space': keys.up = true; event.preventDefault(); break;
                case 'ShiftLeft': case 'ShiftRight': keys.sprint = true; break;
                case 'KeyC': keys.down = true; break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': keys.forward = false; break;
                case 'ArrowDown': case 'KeyS': keys.backward = false; break;
                case 'ArrowLeft': case 'KeyA': keys.left = false; break;
                case 'ArrowRight': case 'KeyD': keys.right = false; break;
                case 'Space': keys.up = false; break;
                case 'ShiftLeft': case 'ShiftRight': keys.sprint = false; break;
                case 'KeyC': keys.down = false; break;
            }
        });

        let isMouseLocked = false;
        renderer.domElement.addEventListener('click', () => {
            if (isFirstPerson) renderer.domElement.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isMouseLocked = document.pointerLockElement === renderer.domElement;
            document.getElementById('startPrompt').style.display = isMouseLocked ? 'none' : 'block';
        });
        document.addEventListener('mousemove', (event) => {
            if (isMouseLocked && isFirstPerson) {
                yaw -= event.movementX * lookSpeed;
                pitch -= event.movementY * lookSpeed;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
